name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project SupernovaWatch.xcodeproj \
            -scheme SupernovaWatch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          PRODUCTS_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p build/Payload
          ditto "$APP_PATH" "build/Payload/$(basename "$APP_PATH")"
          cd build
          /usr/bin/zip -qry SupernovaWatch-unsigned.ipa Payload
          test -s SupernovaWatch-unsigned.ipa
          /usr/bin/unzip -l SupernovaWatch-unsigned.ipa | head -30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SupernovaWatch-unsigned-ipa
          path: build/SupernovaWatch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
