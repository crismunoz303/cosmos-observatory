name: SupernovaWatch
options:
  bundleIdPrefix: com.crismunoz303
  deploymentTarget:
    iOS: "17.0"
targets:
  SupernovaWatch:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crismunoz303.SupernovaWatch
        PRODUCT_NAME: Supernova Watch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Supernova Watch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
